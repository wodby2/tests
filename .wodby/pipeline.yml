version: 0.1

workflows:
  main:
    jobs:
    - build

jobs:
  build:
    steps:
    - clone

    # E2E: this branch must fail its build, so a test can check that the running deployment keeps serving.
    - run: echo 'This E2E fixture branch fails its build on purpose.' && exit 1

    - cache_restore:
        path: ~/.composer
        key: 'composer-{{ hash "composer.lock" }}-v1'

    - run: wodby ci init $WODBY_BUILD_ID

    # use wodby ci run instead of wodby ci build with buildx cache because we need to scaffold web/ for nginx image.
    - run: wodby ci run -- composer install -n --no-ansi
    - run: wodby ci build

    - cache_save:
        key: 'composer-{{ hash "composer.lock" }}-v1'
        path: ~/.composer

    - run: wodby ci push
    - run: wodby ci deploy
